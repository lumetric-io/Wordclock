[env:nextgen-bootstrap]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -Iproducts/nextgen-bootstrap
    -include product_config.h
    -DPRODUCT_CONFIG_HEADER=\"product_config.h\"
    ; Route Serial to the built-in USB-Serial/JTAG port instead of UART0, so
    ; the boot and provisioning logs come out of the same USB cable used to
    ; flash the board -- no separate UART adapter on GPIO43/44. Bootstrap is
    ; the firmware you watch while first-flashing, so this is where it earns
    ; its keep. The board already sets ARDUINO_USB_MODE=1 and nothing else
    ; defines CDC_ON_BOOT, so no build_unflags is needed.
    -DARDUINO_USB_CDC_ON_BOOT=1
; Trim lib_deps: bootstrap doesn't drive LEDs (no Adafruit NeoPixel) and
; doesn't talk to MQTT (no PubSubClient). Listing lib_deps here replaces
; the base inheritance entirely. Keeps the .pio cache lean and the build
; fast.
lib_deps =
    https://github.com/tzapu/WiFiManager.git
    bblanchon/ArduinoJson@^7.4.1
build_src_filter =
    -<*>
    +<log.cpp>
    +<ota_updater.cpp>
    +<system_utils.cpp>
    +<bootstrap_main.cpp>
    +<bootstrap_provision.cpp>
